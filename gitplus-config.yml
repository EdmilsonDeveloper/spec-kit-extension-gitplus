# GIT+ Extension Configuration
# Copied to .specify/extensions/gitplus/gitplus-config.yml on install.

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Branch name template. GIT+ ships a typed default so branches look like
# "<author>/<type>/<number>-<slug>" (e.g. edmilson/fix/003-corrige-carga-xp).
# Supported tokens: {author}, {type}, {app}, {number}, {slug}
#   {author} sanitized git user.name (falls back to the email local part)
#   {type}   the change type inferred by speckit.gitplus.feature (feature, fix, refactor, ...)
#   {app}    sanitized Spec Kit init directory name
#   {number} sequential number or timestamp
#   {slug}   generated short branch slug
# Rules: {slug} must not appear before {number}; the final path segment must start with {number}-.
# Set to "" for the plain "{number}-{slug}" shape, or drop {type} for "{author}/{number}-{slug}".
branch_template: "{author}/{type}/{number}-{slug}"

# Optional shorthand namespace. Leave empty to use branch_template/default behavior.
# Example: "features/{app}" expands to "features/{app}/{number}-{slug}"
branch_prefix: ""

# Commit message used by `git commit` during repository initialization
init_commit_message: "[Spec Kit] Initial commit"

# Commit message style used by the commit command (speckit.gitplus.commit):
# "fixed"        - default; use the configured/static messages below.
# "conventional" - the agent inspects the diff and generates a Conventional
#                  Commit message (e.g. "feat: add OAuth spec").
# "skill"        - the message(s) are produced by the skill named in `commit_skill`,
#                  invoked in an isolated subagent so its context does not leak
#                  into the main chat. The commit(s) are then run deterministically
#                  by the script from files, so no "Co-Authored-By" or other AI
#                  attribution is ever added. The skill may also split the changes
#                  into several logical commits (one message + file set each).
commit_style: fixed

# Skill used when commit_style is "skill". Can be overridden per-invocation with
# the --skill argument of /speckit.gitplus.commit. Ignored for other styles.
commit_skill: ""

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command (used only by
# commit_style: fixed; conventional/skill generate the message instead).
auto_commit:
  default: false
  before_clarify:
    enabled: false
    message: "[Spec Kit] Save progress before clarification"
  before_plan:
    enabled: false
    message: "[Spec Kit] Save progress before planning"
  before_tasks:
    enabled: false
    message: "[Spec Kit] Save progress before task generation"
  before_implement:
    enabled: false
    message: "[Spec Kit] Save progress before implementation"
  before_checklist:
    enabled: false
    message: "[Spec Kit] Save progress before checklist"
  before_analyze:
    enabled: false
    message: "[Spec Kit] Save progress before analysis"
  before_taskstoissues:
    enabled: false
    message: "[Spec Kit] Save progress before issue sync"
  after_constitution:
    enabled: false
    message: "[Spec Kit] Add project constitution"
  after_specify:
    enabled: false
    message: "[Spec Kit] Add specification"
  after_clarify:
    enabled: false
    message: "[Spec Kit] Clarify specification"
  after_plan:
    enabled: false
    message: "[Spec Kit] Add implementation plan"
  after_tasks:
    enabled: false
    message: "[Spec Kit] Add tasks"
  after_implement:
    enabled: false
    message: "[Spec Kit] Implementation progress"
  after_checklist:
    enabled: false
    message: "[Spec Kit] Add checklist"
  after_analyze:
    enabled: false
    message: "[Spec Kit] Add analysis report"
  after_taskstoissues:
    enabled: false
    message: "[Spec Kit] Sync tasks to issues"
