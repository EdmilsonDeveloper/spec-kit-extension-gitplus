schema_version: "1.0"

extension:
  id: gitplus
  name: "GIT+"
  version: "1.0.0"
  description: "Fork of the official git extension with a native {type} branch segment and skill-driven, attribution-free commits generated in an isolated subagent."
  author: "Edmilson Nascimento"
  repository: "https://github.com/EdmilsonDeveloper/spec-kit-extension-gitplus"
  license: MIT

requires:
  speckit_version: ">=0.2.0"
  tools:
    - name: git
      required: false

provides:
  commands:
    - name: speckit.gitplus.feature
      file: commands/speckit.gitplus.feature.md
      description: "Create a typed feature branch <author>/<type>/<number>-<slug> (type inferred from the request)"
    - name: speckit.gitplus.validate
      file: commands/speckit.gitplus.validate.md
      description: "Validate current branch follows feature branch naming conventions"
    - name: speckit.gitplus.remote
      file: commands/speckit.gitplus.remote.md
      description: "Detect Git remote URL for GitHub integration"
    - name: speckit.gitplus.initialize
      file: commands/speckit.gitplus.initialize.md
      description: "Initialize a Git repository with an initial commit"
    - name: speckit.gitplus.commit
      file: commands/speckit.gitplus.commit.md
      description: "Commit changes; optionally generate the message via a named skill in an isolated subagent, committed deterministically without AI attribution"

  config:
    - name: "gitplus-config.yml"
      template: "config-template.yml"
      description: "GIT+ branching and commit configuration"
      required: false

hooks:
  before_constitution:
    command: speckit.gitplus.initialize
    optional: false
    description: "Initialize Git repository before constitution setup"
  before_specify:
    command: speckit.gitplus.feature
    optional: false
    description: "Create typed feature branch before specification"
  before_clarify:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit outstanding changes before clarification?"
    description: "Auto-commit before spec clarification"
  before_plan:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit outstanding changes before planning?"
    description: "Auto-commit before implementation planning"
  before_tasks:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit outstanding changes before task generation?"
    description: "Auto-commit before task generation"
  before_implement:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit outstanding changes before implementation?"
    description: "Auto-commit before implementation"
  before_checklist:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit outstanding changes before checklist?"
    description: "Auto-commit before checklist generation"
  before_analyze:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit outstanding changes before analysis?"
    description: "Auto-commit before analysis"
  before_taskstoissues:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit outstanding changes before issue sync?"
    description: "Auto-commit before tasks-to-issues conversion"
  after_constitution:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit constitution changes?"
    description: "Auto-commit after constitution update"
  after_specify:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit specification changes?"
    description: "Auto-commit after specification"
  after_clarify:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit clarification changes?"
    description: "Auto-commit after spec clarification"
  after_plan:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit plan changes?"
    description: "Auto-commit after implementation planning"
  after_tasks:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit task changes?"
    description: "Auto-commit after task generation"
  after_implement:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit implementation changes?"
    description: "Auto-commit after implementation"
  after_checklist:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit checklist changes?"
    description: "Auto-commit after checklist generation"
  after_analyze:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit analysis results?"
    description: "Auto-commit after analysis"
  after_taskstoissues:
    command: speckit.gitplus.commit
    optional: true
    prompt: "Commit after syncing issues?"
    description: "Auto-commit after tasks-to-issues conversion"

tags:
  - "git"
  - "branching"
  - "conventional-commits"
  - "skill"

config:
  defaults:
    branch_numbering: sequential
    branch_template: "{author}/{type}/{number}-{slug}"
    branch_prefix: ""
    init_commit_message: "[Spec Kit] Initial commit"
    commit_style: fixed
    commit_skill: ""
